<html>
<head>
  <title>Bayou City Family Health - Patient Registration</title>
  <link rel="stylesheet" href="homework1.css">
</head>
<body>
  <div id="header">
    <h1>Bayou City Family Health</h1>
    <h2>Patient Registration Form</h2>
  </div>
  <div id="main">
    <form action="thankyou.html">
      <table>
        <!-- Name row: first name, middle initial, last name -->
        <tr>
          <td><label for="first_name">First Name</label></td>
          <td>
            <input type="text"
              id="first_name"
              name="first_name"
              size="20"
              maxlength="30"
              placeholder="First name"
              required>
          </td>
          <td><label for="middle_initial">MI</label></td>
          <td>
            <input type="text"
              id="middle_initial"
              name="middle_initial"
              size="1"
              maxlength="1">
          </td>
          <td><label for="last_name">Last Name</label></td>
          <td>
            <input type="text"
              id="last_name"
              name="last_name"
              size="20"
              maxlength="30"
              placeholder="Last name"
              required>
          </td>
        </tr>
        <!-- Date of birth row -->
        <tr>
          <td><label for="date_of_birth">Date of Birth</label></td>
          <td>
            <input type="text"
              id="date_of_birth"
              name="date_of_birth"
              size="10"
              maxlength="10"
              placeholder="MM/DD/YYYY"
              required>
          </td>
        </tr>
        <!-- Social Security number row (test values only) -->
        <tr>
          <td><label for="ssn">Social Security Number</label></td>
          <td>
            <input type="password"
              id="ssn"
              name="ssn"
              size="11"
              minlength="9"
              maxlength="11"
              placeholder="Enter SSN"
              required>
          </td>
        </tr>
      </table>
    </form>
  </div>
</body>
</html>
