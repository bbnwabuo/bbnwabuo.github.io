<!DOCTYPE html>

<!--
Program name: homework1.html
Author: Brian Nwabuoku
Date created: 09/26/2026
Date last edited: 09/26/2026
Version: 1.0
Description: Patient registration form for Bayou City Family Health.
-->

<html>
<head>
  <title>Bayou City Family Health - Patient Registration</title>
  <link rel="stylesheet" href="homework1.css">
</head>
<body>
  <div id="header">
    <h1>Bayou City Family Health</h1>
    <h2>Patient Registration Form</h2>
  </div>
  <div id="main">
    <form action="thankyou.html">
      <table>
        <!-- Name row: first name, middle initial, last name -->
        <tr>
          <td><label for="first_name">First Name</label></td>
          <td>
            <input type="text"
              id="first_name"
              name="first_name"
              size="20"
              maxlength="30"
              placeholder="First name"
              required>
          </td>
          <td><label for="middle_initial">MI</label></td>
          <td>
            <input type="text"
              id="middle_initial"
              name="middle_initial"
              size="1"
              maxlength="1">
          </td>
          <td><label for="last_name">Last Name</label></td>
          <td>
            <input type="text"
              id="last_name"
              name="last_name"
              size="20"
              maxlength="30"
              placeholder="Last name"
              required>
          </td>
        </tr>
        <!-- Date of birth row -->
        <tr>
          <td><label for="date_of_birth">Date of Birth</label></td>
          <td>
            <input type="text"
              id="date_of_birth"
              name="date_of_birth"
              size="10"
              maxlength="10"
              placeholder="MM/DD/YYYY"
              required>
          </td>
        </tr>
        <!-- Social Security number row -->
        <tr>
          <td><label for="ssn">Social Security Number</label></td>
          <td>
            <input type="password"
              id="ssn"
              name="ssn"
              size="11"
              minlength="9"
              maxlength="11"
              placeholder="Enter SSN"
              required>
          </td>
        </tr>
        <!-- Address rows -->
        <tr>
          <td><label for="address_line1">Address Line 1</label></td>
          <td>
            <input type="text"
              id="address_line1"
              name="address_line1"
              size="30"
              maxlength="30"
              placeholder="Street address"
              required>
          </td>
        </tr>
        <tr>
          <td><label for="address_line2">Address Line 2</label></td>
          <td>
            <input type="text"
              id="address_line2"
              name="address_line2"
              size="30"
              maxlength="30"
              placeholder="Apt, suite, or unit">
          </td>
        </tr>
        <!-- City, state, and zip code row -->
        <tr>
          <td><label for="city">City</label></td>
          <td>
            <input type="text"
              id="city"
              name="city"
              size="20"
              maxlength="30"
              placeholder="City"
              required>
          </td>
          <td><label for="state">State</label></td>
          <td>
            <select id="state"
              name="state"
              required>
              <option value="">Select</option>
              <option value="AL">Alabama</option>
              <option value="AK">Alaska</option>
              <option value="AZ">Arizona</option>
              <option value="AR">Arkansas</option>
              <option value="CA">California</option>
              <option value="CO">Colorado</option>
              <option value="CT">Connecticut</option>
              <option value="DE">Delaware</option>
              <option value="DC">District of Columbia</option>
              <option value="FL">Florida</option>
              <option value="GA">Georgia</option>
              <option value="HI">Hawaii</option>
              <option value="ID">Idaho</option>
              <option value="IL">Illinois</option>
              <option value="IN">Indiana</option>
              <option value="IA">Iowa</option>
              <option value="KS">Kansas</option>
              <option value="KY">Kentucky</option>
              <option value="LA">Louisiana</option>
              <option value="ME">Maine</option>
              <option value="MD">Maryland</option>
              <option value="MA">Massachusetts</option>
              <option value="MI">Michigan</option>
              <option value="MN">Minnesota</option>
              <option value="MS">Mississippi</option>
              <option value="MO">Missouri</option>
              <option value="MT">Montana</option>
              <option value="NE">Nebraska</option>
              <option value="NV">Nevada</option>
              <option value="NH">New Hampshire</option>
              <option value="NJ">New Jersey</option>
              <option value="NM">New Mexico</option>
              <option value="NY">New York</option>
              <option value="NC">North Carolina</option>
              <option value="ND">North Dakota</option>
              <option value="OH">Ohio</option>
              <option value="OK">Oklahoma</option>
              <option value="OR">Oregon</option>
              <option value="PA">Pennsylvania</option>
              <option value="PR">Puerto Rico</option>
              <option value="RI">Rhode Island</option>
              <option value="SC">South Carolina</option>
              <option value="SD">South Dakota</option>
              <option value="TN">Tennessee</option>
              <option value="TX">Texas</option>
              <option value="UT">Utah</option>
              <option value="VT">Vermont</option>
              <option value="VA">Virginia</option>
              <option value="WA">Washington</option>
              <option value="WV">West Virginia</option>
              <option value="WI">Wisconsin</option>
              <option value="WY">Wyoming</option>
            </select>
          </td>
          <td><label for="zip_code">Zip Code</label></td>
          <td>
            <input type="text"
              id="zip_code"
              name="zip_code"
              size="10"
              minlength="5"
              maxlength="10"
              placeholder="Zip code"
              required>
          </td>
        </tr>
      </table>
    </form>
  </div>
</body>
</html>
